      <stop offset="0%" stop-color="#3b3533"/>
      <stop offset="100%" stop-color="#2a2624"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="url(#bg-raz)"/>
  <g transform="translate(56 36) scale(1.28)">

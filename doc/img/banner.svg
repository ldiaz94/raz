    <rect x="22" y="24" width="14" height="52" rx="7" fill="#fff"/>
    <rect x="43" y="24" width="14" height="52" rx="7" fill="#fff" opacity=".55"/>
    <rect x="64" y="24" width="14" height="52" rx="7" fill="#fff" opacity=".28"/>
  </g>
  <text x="220" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#f6f2f0" letter-spacing="2">raz</text>
  <text x="222" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" fill="#b5aba7">a small systems language in Wirth's tradition</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">

# Checks every push to main. A pushed tag vX.Y.Z is checked too and
# becomes a GitHub release, with a tarball of raz, the lib/ it reads
# beside itself, and the manual pages. Run by hand with a tag, it releases an older tag.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to release
        required: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0    # git describe needs the tags
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - run: make check
      - name: release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=raz-${TAG#v}-linux-x86_64
          mkdir -p $d/man && cp -r raz lib LICENSE README.md $d
          cp doc/raz.1 doc/raz.7 doc/raz-tutorial.7 build/raz-lib.3 $d/man
          tar czf $d.tar.gz $d
          gh release create "$TAG" $d.tar.gz --verify-tag \
            --title "raz ${TAG#v}" --notes "$(./raz --version)"

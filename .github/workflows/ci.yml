# Checks every push to main. A pushed tag vX.Y.Z is checked too and
# becomes a GitHub release, with a tarball of raz, the lib/ it reads
# beside itself, and the manual pages. Run by hand with a tag, it releases an older tag.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to release
        required: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0    # git describe needs the tags
      # musl and musl-tools: test/libc over musl, and cabi with musl-gcc
      - run: sudo apt-get update && sudo apt-get install -y musl musl-tools
      # src/boot.sh fetches the release BOOT names, by gh where the
      # repository is private
      - run: make check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make alpine
      - name: release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make dist
          gh release create "$TAG" build/raz-${TAG#v}-linux-x86_64.tar.gz --verify-tag \
            --title "raz ${TAG#v}" --notes "$(./raz --version)"
